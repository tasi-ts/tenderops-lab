services:
  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    image:
      tenderops-api:0.1.0
    container_name: tenderops-api
    ports:
      - 8080:8080
    environment:
      - SPRING_PROFILES_ACTIVE=local
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    