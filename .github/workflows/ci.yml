name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  api-check:
    name: API - Test and Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run API CI checks
        run: ./scripts/ci/api-check.sh
