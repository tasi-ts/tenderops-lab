spring:
  application:
    name: tenderops-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tenderops}
    username: ${SPRING_DATASOURCE_USERNAME:tenderops}
    password: ${SPRING_DATASOURCE_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    create-schemas: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: TenderOps API
    description: Minimal API service for the TenderOps DevOps lab
    version: 0.1.0