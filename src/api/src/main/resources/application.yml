spring:
  application:
    name: tenderops-api

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: TenderOps API
    description: Minimal API service for the TenderOps DevOps lab
    version: 0.1.0
