apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tenderops-db-data
  namespace: tenderops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenderops-db
  namespace: tenderops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenderops-db
  template:
    metadata:
      labels:
        app: tenderops-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: tenderops-db-runtime-secret
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tenderops
                - -d
                - tenderops
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tenderops
                - -d
                - tenderops
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: tenderops-db-data
        - name: postgres-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tenderops-db
  namespace: tenderops
spec:
  selector:
    app: tenderops-db
  ports:
    - port: 5432
      targetPort: 5432
