api:
  name: tenderops-api
  image:
    repository: tenderops-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  profile: local
  observability:
    exposedEndpoints: "health,info,metrics"
    showHealthDetails: "always" # local-only; use "never" or "when_authorized" outside local demos
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

db:
  name: tenderops-db
  image:
    repository: postgres
    tag: "16-alpine"
  port: 5432
  database: tenderops
  username: tenderops
  password: tenderops
  storage: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

networkPolicy:
  enabled: true
