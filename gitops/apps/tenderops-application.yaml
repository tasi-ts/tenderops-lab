apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenderops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/tasi-ts/tenderops-lab.git
    targetRevision: main
    path: charts/tenderops

  destination:
    server: https://kubernetes.default.svc
    namespace: tenderops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
